services:
  backend:
    build: ./backend
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-sample}
      BUFFER_QUANTILE: ${BUFFER_QUANTILE:-0.95}
      ELEXON_BASE_URL: ${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"